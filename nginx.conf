server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Alles kommt vom eigenen Server – nichts Externes erlaubt
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # /impressum -> impressum.html, alte Links /impressum.html gehen weiterhin
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Gehashte Build-Dateien dürfen lange gecacht werden
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
}
